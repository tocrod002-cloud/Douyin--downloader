<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f6f8">
  <title>抖音媒體下載器</title>

  <style>
    :root {
      --bg: #f4f6f8;
      --card: #ffffff;
      --blue: #20a7ed;
      --blue-dark: #1296d9;
      --gray: #70828f;
      --red: #e91e63;
      --text: #27323a;
      --muted: #87929a;
      --line: #e2e7ea;
      --shadow: 0 8px 22px rgba(40, 52, 60, 0.15);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
        "PingFang TC", "PingFang HK", "Helvetica Neue", Arial, sans-serif;

      color: var(--text);
      -webkit-font-smoothing: antialiased;

      padding:
        calc(58px + env(safe-area-inset-top))
        16px
        calc(36px + env(safe-area-inset-bottom));
    }

    .wrap {
      width: min(100%, 760px);
      margin: 0 auto;
    }

    .card {
      background: var(--card);
      border-radius: 22px;
      box-shadow: var(--shadow);
      padding: 34px 28px 30px;
    }

    h1 {
      margin: 0 0 28px;
      color: var(--blue);
      text-align: center;
      font-size: clamp(30px, 7.5vw, 42px);
      font-weight: 760;
      letter-spacing: .01em;
    }

    .input-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: 10px;
      align-items: stretch;
    }

    textarea {
      width: 100%;
      min-height: 88px;
      resize: vertical;

      border: 1.5px solid #bcc4c9;
      border-radius: 14px;

      padding: 14px 15px;

      font: inherit;
      font-size: 16px;
      line-height: 1.45;

      color: var(--text);
      outline: none;
      background: #fff;

      -webkit-appearance: none;
      appearance: none;
    }

    textarea:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(32, 167, 237, .12);
    }

    textarea::placeholder {
      color: #a3a9ae;
    }

    button,
    .download-btn {
      border: 0;
      border-radius: 13px;

      font: inherit;
      font-weight: 680;

      cursor: pointer;

      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    button:active,
    .download-btn:active {
      transform: translateY(1px);
    }

    button:disabled {
      opacity: .62;
      cursor: default;
      transform: none;
    }

    .paste,
    .clear {
      min-width: 74px;
      padding: 0 13px;

      color: #fff;
      font-size: 17px;
    }

    .paste {
      background: var(--gray);
    }

    .clear {
      background: var(--red);
    }

    .primary {
      width: 100%;
      min-height: 70px;

      margin-top: 24px;

      background: var(--blue);
      color: #fff;

      font-size: 21px;

      box-shadow:
        inset 0 -4px 0 rgba(0,0,0,.035);
    }

    .primary:hover {
      background: var(--blue-dark);
    }

    .message {
      display: none;

      margin-top: 17px;
      padding: 13px 14px;

      border-radius: 11px;

      font-size: 14px;
      line-height: 1.5;
    }

    .message.info {
      display: block;

      background: #f2f6f8;
      color: #55636d;
    }

    .message.error {
      display: block;

      background: #fff0f3;
      color: #b31444;
    }

    .results {
      display: none;
      margin-top: 22px;
    }

    .results.show {
      display: block;
    }

    .post-box {
      display: grid;

      grid-template-columns:
        72px
        minmax(0, 1fr);

      gap: 12px;

      align-items: center;

      margin-bottom: 14px;
      padding: 10px;

      border: 1px solid var(--line);
      border-radius: 14px;

      background: #fbfcfd;
    }

    .post-cover {
      width: 72px;
      height: 72px;

      object-fit: cover;

      border-radius: 11px;

      background: #edf1f3;
    }

    .post-author {
      font-weight: 730;
      font-size: 16px;
    }

    .post-desc {
      margin-top: 4px;

      color: #68747c;

      font-size: 13px;
      line-height: 1.4;

      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;

      overflow: hidden;
    }

    .media-list {
      display: grid;
      gap: 13px;
    }

    .media-item {
      display: grid;

      grid-template-columns:
        82px
        minmax(0, 1fr)
        auto;

      gap: 13px;

      align-items: center;

      padding: 11px;

      border: 1px solid var(--line);
      border-radius: 15px;

      background: #fff;
    }

    .thumb {
      width: 82px;
      height: 82px;

      object-fit: cover;

      border-radius: 11px;

      background: #edf1f3;
    }

    .media-title {
      font-size: 17px;
      font-weight: 720;
    }

    .media-sub {
      margin-top: 5px;

      color: var(--muted);

      font-size: 12.5px;
      line-height: 1.4;
    }

    .download-btn {
      display: inline-flex;

      align-items: center;
      justify-content: center;

      min-width: 108px;
      min-height: 52px;

      padding: 0 15px;

      background: var(--blue);
      color: #fff;

      text-decoration: none;

      white-space: nowrap;

      font-size: 15px;
    }

    .note {
      margin-top: 15px;

      color: #959da3;

      font-size: 12px;
      line-height: 1.5;
    }

    @media (max-width: 620px) {
      body {
        padding-top:
          calc(
            68px +
            env(safe-area-inset-top)
          );
      }

      .card {
        padding: 32px 16px 27px;
      }

      .input-row {
        grid-template-columns:
          minmax(0, 1fr)
          68px
          68px;
      }

      .paste,
      .clear {
        min-width: 0;
        padding: 0 6px;
      }

      .media-item {
        grid-template-columns:
          70px
          minmax(0, 1fr);
      }

      .thumb {
        width: 70px;
        height: 70px;
      }

      .download-btn {
        grid-column: 1 / -1;

        width: 100%;
        min-height: 52px;
      }
    }
  </style>
</head>

<body>

  <main class="wrap">

    <section class="card">

      <h1>抖音媒體下載器</h1>

      <div class="input-row">

        <textarea
          id="input"
          placeholder="貼上抖音分享文字或鏈接…"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
        ></textarea>

        <button
          id="pasteBtn"
          class="paste"
          type="button"
        >
          貼上
        </button>

        <button
          id="clearBtn"
          class="clear"
          type="button"
        >
          清除
        </button>

      </div>

      <button
        id="fetchBtn"
        class="primary"
        type="button"
      >
        獲取內容
      </button>

      <div
        id="message"
        class="message"
        role="status"
        aria-live="polite"
      ></div>

      <section
        id="results"
        class="results"
      >

        <div
          id="postBox"
          class="post-box"
        >

          <img
            id="postCover"
            class="post-cover"
            alt="作品預覽"
          >

          <div>

            <div
              id="postAuthor"
              class="post-author"
            ></div>

            <div
              id="postDesc"
              class="post-desc"
            ></div>

          </div>

        </div>

        <div
          id="mediaList"
          class="media-list"
        ></div>

        <div class="note">
          僅支援可公開訪問的抖音作品。請只下載你有權保存或使用的內容。
        </div>

      </section>

    </section>

  </main>


  <script>

    const input =
      document.getElementById(
        "input"
      );

    const pasteBtn =
      document.getElementById(
        "pasteBtn"
      );

    const clearBtn =
      document.getElementById(
        "clearBtn"
      );

    const fetchBtn =
      document.getElementById(
        "fetchBtn"
      );

    const message =
      document.getElementById(
        "message"
      );

    const results =
      document.getElementById(
        "results"
      );

    const postCover =
      document.getElementById(
        "postCover"
      );

    const postAuthor =
      document.getElementById(
        "postAuthor"
      );

    const postDesc =
      document.getElementById(
        "postDesc"
      );

    const mediaList =
      document.getElementById(
        "mediaList"
      );


    let currentPost =
      null;


    function showMessage(
      text,
      type = "info"
    ) {

      message.textContent =
        text;

      message.className =
        `message ${type}`;
    }


    function hideMessage() {

      message.textContent =
        "";

      message.className =
        "message";
    }


    function resetResults() {

      results.classList.remove(
        "show"
      );

      mediaList.innerHTML =
        "";

      postAuthor.textContent =
        "";

      postDesc.textContent =
        "";

      postCover.removeAttribute(
        "src"
      );

      currentPost =
        null;
    }


    function filenameFor(
      item,
      index
    ) {

      const id =
        currentPost?.id ||
        "douyin";


      if (
        item.type ===
        "photo"
      ) {

        return (
          `Douyin-${id}-photo-${index + 1}.jpg`
        );
      }


      return (
        `Douyin-${id}-video.mp4`
      );
    }


    function downloadUrl(
      item,
      index
    ) {

      let url =
        "/api/download" +
        "?url=" +
        encodeURIComponent(
          item.url
        );


      if (item.fallback) {

        url +=
          "&fallback=" +
          encodeURIComponent(
            item.fallback
          );
      }


      url +=
        "&filename=" +
        encodeURIComponent(
          filenameFor(
            item,
            index
          )
        );


      return url;
    }


    function mediaDetail(
      item
    ) {

      if (
        item.type ===
        "photo"
      ) {

        return "高清原圖";
      }


      const parts =
        [];


      if (
        item.width &&
        item.height
      ) {

        parts.push(
          `${item.width} × ${item.height}`
        );
      }


      if (
        item.bitrate
      ) {

        parts.push(
          `${(
            item.bitrate /
            1000000
          ).toFixed(1)} Mbps`
        );
      }


      parts.push(
        item.quality ||
        "最高可用畫質"
      );


      return parts.join(
        " · "
      );
    }


    function render(
      data
    ) {

      resetResults();


      currentPost =
        data.post || {};


      postAuthor.textContent =
        currentPost.author ||
        `作品 ${currentPost.id || ""}`;


      postDesc.textContent =
        currentPost.desc ||
        (
          currentPost.type ===
          "images"

            ? `找到 ${data.media.length} 張圖片`

            : "影片作品"
        );


      const cover =
        currentPost.cover ||
        data.media?.[0]?.preview ||
        "";


      if (cover) {

        postCover.src =
          cover;
      }


      postCover.onerror =
        () => {

          postCover.style.opacity =
            ".15";
        };


      data.media.forEach(
        (
          item,
          index
        ) => {

          const row =
            document.createElement(
              "article"
            );

          row.className =
            "media-item";


          const img =
            document.createElement(
              "img"
            );

          img.className =
            "thumb";

          img.alt =
            item.label ||
            `媒體 ${index + 1}`;

          img.loading =
            "lazy";

          img.src =
            item.preview ||
            currentPost.cover ||
            "";


          img.onerror =
            () => {

              img.style.opacity =
                ".15";
            };


          const info =
            document.createElement(
              "div"
            );


          const title =
            document.createElement(
              "div"
            );

          title.className =
            "media-title";

          title.textContent =
            item.label ||
            `媒體 ${index + 1}`;


          const sub =
            document.createElement(
              "div"
            );

          sub.className =
            "media-sub";

          sub.textContent =
            mediaDetail(
              item
            );


          info.append(
            title,
            sub
          );


          const a =
            document.createElement(
              "a"
            );

          a.className =
            "download-btn";

          a.href =
            downloadUrl(
              item,
              index
            );

          a.setAttribute(
            "download",
            ""
          );

          a.setAttribute(
            "rel",
            "nofollow"
          );


          a.textContent =
            item.type ===
            "photo"

              ? "下載原圖"

              : "下載影片";


          row.append(
            img,
            info,
            a
          );


          mediaList.appendChild(
            row
          );
        }
      );


      results.classList.add(
        "show"
      );
    }


    async function fetchMedia() {

      const raw =
        input.value.trim();


      if (!raw) {

        showMessage(
          "請先貼上抖音分享文字或鏈接。",
          "error"
        );

        input.focus();

        return;
      }


      hideMessage();

      resetResults();


      fetchBtn.disabled =
        true;

      fetchBtn.textContent =
        "正在解析…";


      try {

        const response =
          await fetch(
            "/api?url=" +
            encodeURIComponent(
              raw
            ),
            {
              headers: {
                "Accept":
                  "application/json"
              },

              cache:
                "no-store"
            }
          );


        const data =
          await response
            .json()
            .catch(
              () => ({})
            );


        if (
          !response.ok ||
          !data.ok
        ) {

          throw new Error(
            data.error ||
            `解析失敗（HTTP ${response.status}）`
          );
        }


        if (
          !Array.isArray(
            data.media
          ) ||
          !data.media.length
        ) {

          throw new Error(
            "這則作品沒有找到可下載媒體。"
          );
        }


        render(
          data
        );


        showMessage(
          data.post?.type ===
          "images"

            ? `成功找到 ${data.media.length} 張圖片。`

            : "成功取得影片，下載時會優先嘗試原畫來源。",

          "info"
        );


      } catch (error) {

        console.error(
          error
        );


        showMessage(
          error?.message ||
          "解析失敗，請稍後再試。",
          "error"
        );


      } finally {

        fetchBtn.disabled =
          false;

        fetchBtn.textContent =
          "獲取內容";
      }
    }


    pasteBtn.addEventListener(
      "click",
      async () => {

        hideMessage();


        try {

          const text =
            await navigator.clipboard
              .readText();


          if (text) {

            input.value =
              text.trim();

            input.focus();

          } else {

            showMessage(
              "剪貼簿目前沒有文字。",
              "info"
            );
          }


        } catch {

          input.focus();


          showMessage(
            "Safari 沒有允許直接讀取剪貼簿，請長按輸入框後選擇「貼上」。",
            "info"
          );
        }
      }
    );


    clearBtn.addEventListener(
      "click",
      () => {

        input.value =
          "";

        hideMessage();

        resetResults();

        input.focus();
      }
    );


    fetchBtn.addEventListener(
      "click",
      fetchMedia
    );


    input.addEventListener(
      "keydown",
      event => {

        if (
          (
            event.metaKey ||
            event.ctrlKey
          ) &&
          event.key ===
          "Enter"
        ) {

          fetchMedia();
        }
      }
    );

  </script>

</body>
</html>
